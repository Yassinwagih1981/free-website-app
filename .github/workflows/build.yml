name: Orbitly Framework Fix
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node Env
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Native iOS
        run: npx expo prebuild --platform ios --clean

      - name: Extract Dynamic IPA Container
        run: |
          mkdir -p build/Payload
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme * -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" GCC_WARN_INHIBIT_ALL_WARNINGS=YES
          cd ..
          find ios/build -name "*.app" -exec cp -R {} build/Payload/ \;
          cd build
          zip -qy -r Orbitly.ipa Payload

      - name: Upload Repackaged App
        uses: actions/upload-artifact@v4
        with:
          name: Orbitly-App-Package
          path: build/Orbitly.ipa
